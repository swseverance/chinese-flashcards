<app-page>
  <header>
    <a nz-button nzType="default" nzShape="circle" routerLink="/dashboard">
      <nz-icon nzType="left" [style.color]="'#1890ff'" />
    </a>
    
    <strong>Study</strong>
  </header>

  <main>
    @if (loading()) {
      <nz-spin />
    } @else if (groups().length === 0) {
      <nz-empty nzNotFoundContent="No flashcards found" />
    } @else {
      <nz-list nzBordered>
        @for (group of groups(); track group[0]) {
          <nz-list-item
            class="group-row"
            [routerLink]="['/dashboard/study', type, group[0]]"
          >
            <span>Level {{ group[0] }}</span>
            <nz-badge [nzCount]="group[1]" [nzStyle]="{ backgroundColor: '#1890ff' }" />
          </nz-list-item>
        }
      </nz-list>
    }
  </main>
</app-page>
