<app-page>
  <header>
    <a nz-button nzType="default" nzShape="circle" routerLink="/dashboard">
      <nz-icon nzType="left" [style.color]="'#1890ff'" />
    </a>

    <strong>Create</strong>
  </header>

  <main>
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="!loading() && onSubmit()">
      <nz-form-item>
        <nz-form-label nzRequired>Chinese</nz-form-label>
        <nz-form-control [nzErrorTip]="'Required'">
          <input nz-input formControlName="chinese" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Pinyin</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="pinyin" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Translation</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="translation" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Notes</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="notes" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Type</nz-form-label>
        <nz-form-control>
          <nz-radio-group formControlName="type">
            <label nz-radio [nzValue]="FlashcardType.WORD">Word</label>
            <label nz-radio [nzValue]="FlashcardType.SENTENCE">Sentence</label>
          </nz-radio-group>
        </nz-form-control>
      </nz-form-item>

      <button
        nz-button
        nzType="primary"
        type="submit"
        [disabled]="form.invalid"
        [nzLoading]="loading()"
      >
        Create
      </button>
    </form>
  </main>
</app-page>
